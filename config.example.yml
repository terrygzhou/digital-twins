# digital-twins — committed-defaults example (kb.yml)
# Precedence: env (incl. .env) > kb.local.yml > kb.yml > built-in defaults.
# Env vars: KB_ prefix, `__` = nesting (e.g. KB_QDRANT__URL) — see .env.example.
# Every source is disabled by default (BR-11.2.7).

# --- Global ---
# state_dir: ~/.digital-twins          # env: KB_STATE_DIR
# config_dir: ~/.config/digital-twins  # env: KB_CONFIG_DIR

# --- Endpoints (user-supplied; init prompts for these) ---
qdrant:
  url: ""          # env: KB_QDRANT__URL
  api_key: ""      # env: KB_QDRANT__API_KEY
neo4j:
  url: ""          # env: KB_NEO4J__URL
  user: ""         # env: KB_NEO4J__USER
  password: ""     # env: KB_NEO4J__PASSWORD
  # S4 graph store: when all three are set, every ingest surface
  # (schedule / run --once / MCP / web) writes :SourceItem nodes
  # (deduped on item_id; chunk text is NOT stored here — it lives in
  # Qdrant's payload `full_content` field). Leave unset to run
  # Qdrant-only (graph writes silently skipped, logged).
  # After upgrading from a pre-S4 install, run `digital-twins migrate s4`
  # to remove legacy :KbItem/:KbChunk nodes, then re-ingest (point IDs
  # are content-independent under the S4 scheme — old points are orphans).
llm:
  endpoint: ""     # env: KB_LLM__ENDPOINT
  model: ""        # env: KB_LLM__MODEL
  api_key: ""      # env: KB_LLM__API_KEY

# --- Extraction (LLM entity extraction, config-gated) ---
# When enabled, every ingest surface that has a Neo4j driver runs an LLM
# entity extraction step after the :SourceItem graph write. Requires
# llm.endpoint to be set. Default: disabled (no LLM calls, no entity writes).
extraction:
  enabled: false          # env: KB_EXTRACTION__ENABLED
  max_text_chars: 12000  # env: KB_EXTRACTION__MAX_TEXT_CHARS
  prompt_version: ""     # env: KB_EXTRACTION__PROMPT_VERSION (empty = use built-in)

# --- Embedding ---
embedding:
  model: "BAAI/bge-small-en-v1.5"  # 384-dim; model version pinned by the package (env: KB_EMBEDDING__MODEL)
  device: "auto"                  # auto | cpu | cuda (env: KB_EMBEDDING__DEVICE)
  endpoint: ""                    # optional hosted-embedding OpenAI-compatible endpoint, e.g. http://embed:9000/v1 (env: KB_EMBEDDING__ENDPOINT)
  api_key: ""                     # bearer token for embedding.endpoint, when it requires one (env: KB_EMBEDDING__API_KEY)

# --- Chunking ---
chunking:
  max_chars: 800                  # env: KB_CHUNKING__MAX_CHARS
  overlap: 100                    # env: KB_CHUNKING__OVERLAP

# --- Scheduler ---
scheduler:
  status_port: 8765               # env: KB_SCHEDULER__STATUS_PORT
                                  # 0 disables the status endpoint (CLI remains the fallback surface)

# --- MCP ---
mcp:
  port: 8770                      # env: KB_MCP__PORT
  service_account_email: system  # env: KB_MCP__SERVICE_ACCOUNT_EMAIL

# --- Web ---
web:
  bind: "127.0.0.1"            # address the web UI binds to (localhost-only by default)  # env: KB_WEB__BIND
  port: 8767                   # TCP port for the web UI server                            # env: KB_WEB__PORT
  base_url: "http://localhost:8767"  # public URL of the web UI, e.g. for links in tool output  # env: KB_WEB__BASE_URL

# --- Sources (all disabled by default) ---
sources:
  # Built-in sources (shipped with the package; enabled per install).
  hermes:
    enabled: false       # env: KB_SOURCES__HERMES__ENABLED
    max_items: 200       # env: KB_SOURCES__HERMES__MAX_ITEMS
    timeout_s: 1500      # env: KB_SOURCES__HERMES__TIMEOUT_S
    # extra: { state_db: "" }   # readable hermes session store (prerequisite)
  pi:
    enabled: false       # env: KB_SOURCES__PI__ENABLED
    max_items: 200       # env: KB_SOURCES__PI__MAX_ITEMS
    timeout_s: 1500      # env: KB_SOURCES__PI__TIMEOUT_S
    # extra: { sessions_dir: "" }   # readable pi sessions dir (prerequisite)
  dsh:
    enabled: false       # env: KB_SOURCES__DSH__ENABLED
    max_items: 200       # env: KB_SOURCES__DSH__MAX_ITEMS
    timeout_s: 1500      # env: KB_SOURCES__DSH__TIMEOUT_S
    # extra: { sessions_dir: "" }   # readable dsh sessions dir (prerequisite)
  paperclip:
    enabled: false       # env: KB_SOURCES__PAPERCLIP__ENABLED
    max_items: 200       # env: KB_SOURCES__PAPERCLIP__MAX_ITEMS
    timeout_s: 1500      # env: KB_SOURCES__PAPERCLIP__TIMEOUT_S
    # extra: { pg_dsn: "" }        # paperclip Postgres DSN (prerequisite)
  yahoo:
    enabled: false       # env: KB_SOURCES__YAHOO__ENABLED
    max_items: 200       # env: KB_SOURCES__YAHOO__MAX_ITEMS
    timeout_s: 1500      # env: KB_SOURCES__YAHOO__TIMEOUT_S
    credential: ""       # env: YMAIL_APP_PASSWORD
    email: ""            # env: YMAIL_EMAIL (IMAP account address; empty = use env var)
    # extra: { imap_host: "imap.mail.yahoo.com" }
  gmail:
    enabled: false       # env: KB_SOURCES__GMAIL__ENABLED
    max_items: 200       # env: KB_SOURCES__GMAIL__MAX_ITEMS
    timeout_s: 1500      # env: KB_SOURCES__GMAIL__TIMEOUT_S
    credential: ""       # env: GMAIL_APP_PASSWORD
    email: ""            # env: GMAIL_EMAIL (IMAP account address; empty = use env var)
    # extra: { imap_host: "imap.gmail.com" }
  fs:
    enabled: false       # env: KB_SOURCES__FS__ENABLED
    max_items: 200       # env: KB_SOURCES__FS__MAX_ITEMS
    timeout_s: 1500      # env: KB_SOURCES__FS__TIMEOUT_S
    # extra: { dir: "" }            # directory of files (demo/test source)

  # Custom (user-defined) sources — no package update needed.
  # Example: a user-defined source named "mytool". Add such a block to your
  # kb.yml to register a source that ships no package code.
  mytool:
    enabled: false
    entrypoint: "mytool_kb:make_source"  # importable module:factory
    credential: "MYTOOL_TOKEN"           # env-var name the source requires
    prefix: "mytool:"
