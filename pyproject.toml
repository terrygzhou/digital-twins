[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-twins-kb"
dynamic = ["version"]
description = "Environment-portable KB ingestion: layered config, fail-fast named sources, deterministic dedup-safe ingest into user-supplied Qdrant/Neo4j."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Terry Zhou" }]
dependencies = [
  "click>=8.1",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "qdrant-client>=1.7",
  "neo4j>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Local in-process embedding (the pinned BGE model via sentence-transformers).
# A ~5 GB install with the CUDA-bundled torch wheel on GPU hosts; on
# CPU-only hosts install the CPU wheel first (see README):
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install "digital-twins-kb[local-embedding]"
# Endpoint mode (embedding.endpoint) needs neither of these.
local-embedding = ["sentence-transformers>=3.0", "torch>=2.0"]
# MCP SDK is an OPTIONAL extra (research D2): the 004 server speaks raw
# JSON over stdio/HTTP, so it runs WITHOUT the mcp SDK. Clients that want
# a real MCP client stack install the extra.
mcp = ["mcp>=1.2,<2"]

[project.scripts]
digital-twins = "digital_twins.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["digital_twins"]

[tool.hatch.build.targets.wheel.force-include]
"docker-compose.yml" = "digital_twins/compose/docker-compose.yml"

[tool.hatch.version]
path = "digital_twins/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: tests that require real external services (opt-in via env)",
  "preflight_real: tests that run the real preflight gate (008 US1)",
]
