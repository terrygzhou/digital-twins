version: "3.8"
services:
  qdrant:
    image: qdrant/qdrant:1.9.7
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j/neo4j:5.18-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1;"]
      interval: 10s
      timeout: 5s
      retries: 10

  llm:
    image: lmsys/sglang:v0.4.2
    ports:
      - "8000:8000"  # host-side access for digital-twins CLI (0.10.0 fix)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 15s
      timeout: 5s
      retries: 10

  embedding-model:
    # A5 reference stand-in (tracked 005 defect, fixed 2026-09-20).
    # Design intent (specs/005 R16 / specs/008-service-hosting A5): a thin
    # HTTP service serving the pinned embedding model BAAI/bge-small-en-v1.5
    # (384-dim, OpenAI-compatible) on port 8080. This reference image is
    # python:3.11-slim with no build stage and no runtime network guarantee,
    # so no model weights can be baked in. The command below is a stdlib-only
    # deterministic stand-in: every input text maps to a normalized 384-dim
    # vector (same text -> same vector, pure-Python hash projection), which
    # satisfies the package's FR-010 dimension guard. Non-semantic by design;
    # swap for a real inference image in production. No model to cache, so
    # the former TRANSFORMERS_CACHE env and embedding-data volume are gone.
    image: python:3.11-slim
    ports:
      - "8080:8080"  # host-side access for digital-twins CLI (0.10.0 fix)
    command:
      - sh
      - -c
      - |
        python - <<'PYEOF'
        import hashlib
        import json
        import math
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        MODEL = "BAAI/bge-small-en-v1.5"
        DIM = 384

        def embed(text):
            vals = []
            for i in range(DIM):
                digest = hashlib.sha256(("%d|%s" % (i, text)).encode("utf-8")).digest()
                vals.append(int.from_bytes(digest[:4], "big") / 4294967295.0 - 0.5)
            norm = math.sqrt(sum(v * v for v in vals)) or 1.0
            return [v / norm for v in vals]

        class Handler(BaseHTTPRequestHandler):
            def _json(self, obj, status=200):
                body = json.dumps(obj).encode("utf-8")
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                if self.path == "/v1/models":
                    self._json({"object": "list", "data": [
                        {"id": MODEL, "object": "model",
                         "owned_by": "reference-stand-in"}
                    ]})
                else:
                    self.send_error(404)

            def do_POST(self):
                if self.path != "/v1/embeddings":
                    self.send_error(404)
                    return
                length = int(self.headers.get("Content-Length") or 0)
                try:
                    req = json.loads(self.rfile.read(length) or b"{}")
                except ValueError:
                    self.send_error(400)
                    return
                inp = req.get("input", "")
                texts = inp if isinstance(inp, (list, tuple)) else [inp]
                texts = [str(t) for t in texts]
                data = [{"object": "embedding", "index": i,
                         "embedding": embed(t)} for i, t in enumerate(texts)]
                total = sum(len(t) for t in texts)
                self._json({
                    "object": "list",
                    "data": data,
                    "model": req.get("model") or MODEL,
                    "usage": {"prompt_tokens": total, "total_tokens": total},
                })

            def log_message(self, *args):
                pass

        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
        PYEOF
    healthcheck:
      # python:3.11-slim ships no curl; probe with the stdlib instead so the
      # healthcheck is actually functional.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/models')"]
      interval: 15s
      timeout: 5s
      retries: 10

  digital-twins:
    build: .
    image: digital-twins:0.10.0
    environment:
      KB_QDRANT__URL: "http://${QDRANT_HOST:-qdrant}:6333"
      KB_NEO4J__URL: "bolt://${NEO4J_HOST:-neo4j}:7687"
      KB_NEO4J__USER: "${NEO4J_USER:-neo4j}"
      KB_NEO4J__PASSWORD: "${NEO4J_PASSWORD:-password}"
      KB_LLM__ENDPOINT: "http://${LLM_ENDPOINT:-llm}:8000/v1"
      KB_EMBEDDING__ENDPOINT: "http://${EMBEDDING_ENDPOINT:-embedding-model}:8080/v1"
    volumes:
      - digital-twins-state:/data
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      llm:
        condition: service_healthy
      embedding-model:
        condition: service_healthy

volumes:
  qdrant-data:
  neo4j-data:
  digital-twins-state:
